name: Release

# Tag a commit to ship it:
#   git tag v1.2.3 && git push origin v1.2.3
#
# This publishes a Velopack package to a GitHub Release. The cabinet's service
# polls that release and updates itself, so shipping never involves touching the
# Windows machine.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  release:
    # Velopack builds Windows installers on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Manual runs bump off the last release tag, so there's no need to check
      # Code for the current version before running this. Tag pushes (the
      # `git tag vX.Y.Z && git push` path) still use the pushed tag verbatim,
      # for the rare case a specific version number is needed.
      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            latest_tag="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
            latest="${latest_tag#v}"
            latest="${latest:-0.0.0}"
            IFS='.' read -r major minor patch <<< "$latest"
            case "${{ github.event.inputs.bump }}" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            echo "value=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: dotnet test -c Release

      - name: Publish self-contained
        run: >
          dotnet publish src/PinballScores.Service/PinballScores.Service.csproj
          -c Release
          -r win-x64
          --self-contained
          -p:Version=${{ steps.version.outputs.value }}
          -o publish

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      # Velopack can only build a delta against a package it can see locally, and
      # CI starts from a clean checkout. Without this every update is a full ~70MB
      # download. Expected to fail on the very first release, when there is no
      # previous one to fetch.
      - name: Fetch the previous release, for delta generation
        continue-on-error: true
        run: >
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir releases

      - name: Build the update package
        run: >
          vpk pack
          --packId PinballScores
          --packVersion ${{ steps.version.outputs.value }}
          --packDir publish
          --mainExe PinballScores.exe
          --packTitle "Pinball Scores"
          --outputDir releases

      # Velopack verifies package integrity on download and applies updates
      # atomically with rollback, so a partial download cannot brick the cabinet.
      #
      # The cabinet only takes an update whose version is HIGHER than what it is
      # running, so every release needs its version bumped — re-running this with
      # the same version publishes a package no machine will ever install.
      - name: Publish the GitHub Release
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir releases
          --tag v${{ steps.version.outputs.value }}
          --publish
