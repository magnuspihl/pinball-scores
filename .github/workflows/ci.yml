name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The extractors are pure managed code, so the whole test suite — including
    # decoding real .nv and VPReg.stg files — runs on Linux. That was impossible
    # with the previous PINemHi.exe and ole32 implementation.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal
